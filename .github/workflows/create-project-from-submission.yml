name: Create project PR from approved submission

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  create-project:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Create project pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx tsx scripts/create-project-from-issue.ts